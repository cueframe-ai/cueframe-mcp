name: Publish npm packages

# Board decisions, 2026-11-04 and 2026-11-05 (Paperclip CUE-49, CUE-51): Changesets, and a release is the
# merge of the Changesets "Version packages" pull request. Every push to main runs CI (validate), then:
#   - version-pr: while `.changeset/*.md` files are pending, `changesets/action` versions them on the branch
#     `changeset-release/main` (bumps, CHANGELOGs, the contract stamp and the plugin manifests) and opens or
#     updates the "Version packages" pull request into main. It publishes nothing and never pushes to main.
#   - release-plan: lists every package version on main that npm does not have. Only a merged Version
#     packages pull request produces one (`pnpm check:changesets` refuses any other version edit).
#   - publish: runs only when release-plan listed something, and publishes it through npm trusted publishing.
# Homer merges the Version packages pull request under his approval rules; nobody dispatches a publish. A
# failed publish is retried with "Re-run failed jobs" on the same run, which publishes the same commit.
#
# No loop: version-pr pushes `changeset-release/main` (not main) with GITHUB_TOKEN, and GitHub starts no
# workflow run for GITHUB_TOKEN events. That also means the Version packages pull request gets no
# `pull_request` CI run, so version-pr dispatches CI on its branch (workflow_dispatch is the documented
# exception for GITHUB_TOKEN). The skip-ci markers never appear in the Version packages commit, title or body:
# the commit and title are fixed below, and `pnpm check:changesets` refuses a changeset whose summary (which
# becomes the body) carries one, so the merge commit that must publish is never skipped.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version-pr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the changeset-release/main branch (through the GitHub API, as github-actions[bot])
      pull-requests: write # open or update the Version packages pull request
      actions: write # dispatch CI on that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # changesets/action switches to changeset-release/main when it exists
          persist-credentials: false # the action commits through the GitHub API, not git push
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: open or update the Version packages pull request
        id: changesets
        # With no publish-script the action never publishes: with pending changesets it resets
        # changeset-release/main to this commit, runs the version script, commits the result through the
        # API and opens or updates the pull request; with none it does nothing.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          commit-message: |
            Version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          pr-title: Version packages
          create-github-releases: false
          push-git-tags: false
      - name: run CI on the Version packages pull request
        # A pull request opened or updated with GITHUB_TOKEN starts no pull_request workflow, so CI is
        # dispatched on the branch; its checks attach to the branch head, which is the pull request's head.
        if: steps.changesets.outputs.has-changesets == 'true' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref changeset-release/main

  release-plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: versions on main that npm does not have
        id: plan
        # Anonymous metadata lookups; a 404 means "not published", any other error fails the job.
        run: |
          set -euo pipefail
          unpublished="$(node scripts/check-public-packages.mjs --unpublished)"
          echo "unpublished: ${unpublished:-none}"
          echo "unpublished=${unpublished}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: release-plan
    if: needs.release-plan.outputs.unpublished != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC token exchange) and provenance
    # npm trusted publishing (docs.npmjs.com/trusted-publishers): every package below is published with a
    # short-lived token that npm exchanges for this job's GitHub OIDC token; no npm token is stored here.
    # It needs npm CLI 11.5.1 or later, Node 22.14.0 or later and a GitHub-hosted runner (self-hosted
    # runners are not supported). Each package's trusted publisher on npmjs.com names this repository and
    # the workflow file `publish-npm.yml`, with no environment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `registry-url`: it would write an .npmrc auth line and export a placeholder auth token variable,
        # so a failed OIDC exchange would surface as a confusing registry 401/404 instead of ENEEDAUTH.
        with:
          node-version: 24
          cache: pnpm
      - name: npm CLI for trusted publishing
        # pnpm 10 does not exchange the OIDC token itself: `pnpm publish` packs the package (rewriting
        # `workspace:` ranges and applying publishConfig) and then runs `npm publish <tarball>` with the
        # npm next to node (pnpm v10.32.1 releasing/plugin-commands-publishing/src/publish.ts). npm does
        # the exchange, so the npm on PATH must be 11.5.1 or later. Pinned; check the version it reports.
        run: |
          set -euo pipefail
          npm install --global npm@11.21.1
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "${npm_version}" \
            || { echo "::error::npm ${npm_version} is older than 11.5.1; trusted publishing would fail"; exit 1; }
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: no package changed without a version bump (changeset publish skips published versions)
        run: pnpm check:published-versions
      - name: changeset publish
        # Publishes every package whose version npm does not have, each through `pnpm publish` (packing
        # with pnpm, so workspace: ranges and publishConfig are rewritten; npm then publishes the tarball
        # and does the OIDC exchange). Each package's publishConfig.access decides its visibility. A
        # version already on npm is skipped, so a re-run after a partial failure is safe. No git tags:
        # the merged Version packages commit is the record, and this job cannot push.
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: pnpm changeset publish --no-git-tag

      - name: verify anonymous metadata and tarball access
        # npm may take a few minutes to serve a new version: the check polls every 15 s for up to 10 min
        # and fails naming the package, version and URL still missing (run 41939613726 checked at once).
        timeout-minutes: 15
        run: pnpm check:public-packages

  registry:
    # Publishes server.json to the MCP registry (registry.modelcontextprotocol.io). server.json lists
    # the hosted remote only, so nothing here depends on what npm serves; it runs after the npm job
    # only so one release publishes everything in a fixed order.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: publish server.json when its version is new
        # Authentication is `login http`: the registry fetches https://cueframe.ai/.well-known/mcp-registry-auth
        # (an ed25519 public key, `v=MCPv1; k=ed25519; p=...`) and the private key signs the challenge.
        # Flag names confirmed with `mcp-publisher login http --help` at v1.8.1: -domain, -private-key (hex),
        # -algorithm (default ed25519), -registry.
        env:
          MCP_PUBLISHER_PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          name="$(node -p "require('./server.json').name")"
          v="$(node -p "require('./server.json').version")"
          encoded="$(node -p "encodeURIComponent(require('./server.json').name)")"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit((JSON.parse(s).servers||[]).some(e=>(e.server||e).version==='${v}')?0:1))"; then
            echo "${name} ${v} is already in the registry; skipping"
            exit 0
          fi
          if [ -z "${MCP_PUBLISHER_PRIVATE_KEY}" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY is not set; cannot authenticate to the MCP registry"
            exit 1
          fi
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tgz" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login http --domain cueframe.ai --private-key "${MCP_PUBLISHER_PRIVATE_KEY}"
          "$RUNNER_TEMP/mcp-publisher" publish server.json
