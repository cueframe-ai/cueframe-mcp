name: Publish npm packages

# Board decision, 2026-11-04 (Paperclip CUE-49): every merge to main publishes normal versions, through
# Changesets, with no release pull request. A push to main runs CI (validate), then `changeset version`
# turns the merged `.changeset/*.md` files into version bumps and CHANGELOG entries and commits them to
# main (version), then the publish job publishes every package version npm does not have yet (publish).
#
# No loop: the version-bump commit is pushed with the job's GITHUB_TOKEN, and GitHub starts no workflow
# run for a push made with GITHUB_TOKEN; its message also carries `[skip ci]`, and validate refuses to run
# for the github-actions[bot] actor. workflow_dispatch on main re-runs the same flow (for example after a
# failed publish: there is no changeset left, so version commits nothing and publish ships what is missing).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version-bump commit to main; nothing else
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false # only the push step below sees the token
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: version packages from the merged changesets and commit the bump to main
        id: release
        # Only the commit CI validated is versioned. If main has moved on, the run for the newer push
        # releases these changesets too (they stay in .changeset/ until a version commit consumes them),
        # unless main moved by this workflow's own version commit on top of this sha: a re-run then
        # publishes that commit. If branch protection refuses the push, the job fails here and nothing
        # is published.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "${main_sha}" != "${GITHUB_SHA}" ]; then
            if [ "$(git log -1 --format=%P "${main_sha}")" = "${GITHUB_SHA}" ] \
              && git log -1 --format=%s "${main_sha}" | grep -q '^chore(release): version packages \[skip ci\]$'; then
              echo "main is this run's version commit ${main_sha}; publishing it"
              echo "sha=${main_sha}" >> "${GITHUB_OUTPUT}"
            else
              echo "::notice::main moved past ${GITHUB_SHA} to ${main_sha}; the run for that push releases these changesets"
              echo "sha=" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi
          pnpm changeset version
          # Files stamped from package versions: the contract sync manifest's contractVersion follows
          # @cueframe/api-contract (the publish job's build refuses a stale stamp), and the plugin manifests
          # and skill cards follow @cueframe/skills.
          node scripts/sync-contract-stamp.mjs
          pnpm build:plugin
          if [ -z "$(git status --porcelain)" ]; then
            echo "no pending changesets; publishing ${GITHUB_SHA} as it is"
            echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          {
            echo 'chore(release): version packages [skip ci]'
            echo
            node -e "for (const d of ['api-contract','sdk','skills','cli']) { const p = require('./packages/' + d + '/package.json'); console.log('- ' + p.name + ' ' + p.version); }"
          } > "${RUNNER_TEMP}/message.txt"
          git commit --quiet --signoff --file "${RUNNER_TEMP}/message.txt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  publish:
    needs: version
    if: needs.version.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC token exchange) and provenance
    # npm trusted publishing (docs.npmjs.com/trusted-publishers): every package below is published with a
    # short-lived token that npm exchanges for this job's GitHub OIDC token; no npm token is stored here.
    # It needs npm CLI 11.5.1 or later, Node 22.14.0 or later and a GitHub-hosted runner (self-hosted
    # runners are not supported). Each package's trusted publisher on npmjs.com names this repository and
    # the workflow file `publish-npm.yml`, with no environment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `registry-url`: it would write an .npmrc auth line and export a placeholder auth token variable,
        # so a failed OIDC exchange would surface as a confusing registry 401/404 instead of ENEEDAUTH.
        with:
          node-version: 24
          cache: pnpm
      - name: npm CLI for trusted publishing
        # pnpm 10 does not exchange the OIDC token itself: `pnpm publish` packs the package (rewriting
        # `workspace:` ranges and applying publishConfig) and then runs `npm publish <tarball>` with the
        # npm next to node (pnpm v10.32.1 releasing/plugin-commands-publishing/src/publish.ts). npm does
        # the exchange, so the npm on PATH must be 11.5.1 or later. Pinned; check the version it reports.
        run: |
          set -euo pipefail
          npm install --global npm@11.21.1
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "${npm_version}" \
            || { echo "::error::npm ${npm_version} is older than 11.5.1; trusted publishing would fail"; exit 1; }
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: no package changed without a version bump (changeset publish skips published versions)
        run: pnpm check:published-versions
      - name: changeset publish
        # Publishes every package whose version npm does not have, each through `pnpm publish` (packing
        # with pnpm, so workspace: ranges and publishConfig are rewritten; npm then publishes the tarball
        # and does the OIDC exchange). Each package's publishConfig.access decides its visibility. A
        # version already on npm is skipped, so a re-run after a partial failure is safe. No git tags:
        # the version commit is the record, and this job cannot push.
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: pnpm changeset publish --no-git-tag

      - name: verify anonymous metadata and tarball access
        run: pnpm check:public-packages

  registry:
    # Publishes server.json to the MCP registry (registry.modelcontextprotocol.io). server.json lists
    # the hosted remote only, so nothing here depends on what npm serves; it runs after the npm job
    # only so one dispatch publishes everything in a fixed order.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: publish server.json when its version is new
        # Authentication is `login http`: the registry fetches https://cueframe.ai/.well-known/mcp-registry-auth
        # (an ed25519 public key, `v=MCPv1; k=ed25519; p=...`) and the private key signs the challenge.
        # Flag names confirmed with `mcp-publisher login http --help` at v1.8.1: -domain, -private-key (hex),
        # -algorithm (default ed25519), -registry.
        env:
          MCP_PUBLISHER_PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          name="$(node -p "require('./server.json').name")"
          v="$(node -p "require('./server.json').version")"
          encoded="$(node -p "encodeURIComponent(require('./server.json').name)")"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit((JSON.parse(s).servers||[]).some(e=>(e.server||e).version==='${v}')?0:1))"; then
            echo "${name} ${v} is already in the registry; skipping"
            exit 0
          fi
          if [ -z "${MCP_PUBLISHER_PRIVATE_KEY}" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY is not set; cannot authenticate to the MCP registry"
            exit 1
          fi
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tgz" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login http --domain cueframe.ai --private-key "${MCP_PUBLISHER_PRIVATE_KEY}"
          "$RUNNER_TEMP/mcp-publisher" publish server.json
