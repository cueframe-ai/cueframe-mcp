name: Publish npm packages

# Changesets releases: a release is the merge of the Changesets "Version packages" pull request. Every
# push to main runs CI (validate), then:
#   - version-pr: while `.changeset/*.md` files are pending, `changesets/action` versions them on the branch
#     `changeset-release/main` (bumps, CHANGELOGs, the contract stamp and the plugin manifests) and opens or
#     updates the "Version packages" pull request into main. It publishes nothing and never pushes to main.
#   - release-plan: lists every package version on main that npm does not have. Only a merged Version
#     packages pull request produces one (`pnpm check:changesets` refuses any other version edit).
#   - publish: runs only when release-plan listed something, and publishes it through npm trusted publishing.
#     `npm publish` exiting 0 is the success signal; no step polls npm afterwards.
#   - tag: tags the released commit `<name>@<version>` for each published package.
# Nobody dispatches a publish. A failed publish is retried with "Re-run failed jobs" on the same run, which
# publishes the same commit and skips versions npm already has.
#
# Tokens: version-pr and tag use a GitHub App installation token (secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY), narrowed to the permissions each job needs. GitHub starts no workflow for a pull
# request opened with GITHUB_TOKEN, so the App token is what gives the Version packages pull request its
# normal pull_request CI. Both jobs fail if either secret is missing; nothing falls back to GITHUB_TOKEN.
#
# No loop: version-pr writes `changeset-release/main`, never main, and tags do not match this workflow's
# `branches: [main]` filter. The skip-ci markers never appear in the Version packages commit, title or body:
# the commit and title are fixed below, and `pnpm check:changesets` refuses a changeset whose summary (which
# becomes the body) carries one, so the merge commit that must publish is never skipped.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read

  version-pr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the App token below does the writing
    steps:
      - name: the release App secrets are set
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_ID}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be set; a Version packages pull request opened with GITHUB_TOKEN would get no CI"
            exit 1
          fi
      - name: App token (contents and pull requests, this repository only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # changesets/action switches to changeset-release/main when it exists
          persist-credentials: false # with commitMode github-api the action commits through the API
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          : "${NPM_TOKEN:?NPM_TOKEN is required to read restricted build dependencies}"
          umask 077
          install_npmrc="$(mktemp "$RUNNER_TEMP/cueframe-npmrc.XXXXXX")"
          trap 'rm -f "$install_npmrc"' EXIT
          # npm expands the placeholder; never write the token value to this file.
          # shellcheck disable=SC2016
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$install_npmrc"
          NPM_CONFIG_USERCONFIG="$install_npmrc" pnpm install --frozen-lockfile
      - name: open or update the Version packages pull request
        # v1.9.0: v2 of the action refuses @changesets/cli 2.x, which this repository uses. With no `publish`
        # input the action never publishes: with pending changesets it resets changeset-release/main to this
        # commit, runs the version script, commits the result through the API as the App and opens or
        # updates the pull request; with none it does nothing.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm release:version
          commit: Version packages
          title: Version packages
          commitMode: github-api
          createGithubReleases: false

  release-plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: versions on main that npm does not have
        id: plan
        # Anonymous metadata lookups; a 404 means "not published", any other error fails the job.
        run: |
          set -euo pipefail
          unpublished="$(node scripts/check-public-packages.mjs --unpublished)"
          echo "unpublished: ${unpublished:-none}"
          echo "unpublished=${unpublished}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: release-plan
    if: needs.release-plan.outputs.unpublished != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC token exchange) and provenance
    # npm trusted publishing (docs.npmjs.com/trusted-publishers): every package below is published with a
    # short-lived token that npm exchanges for this job's GitHub OIDC token. The dependency install
    # alone uses the existing read token; its temporary npm configuration is removed before publishing.
    # It needs npm CLI 11.5.1 or later, Node 22.14.0 or later and a GitHub-hosted runner (self-hosted
    # runners are not supported). Each package's trusted publisher on npmjs.com names this repository and
    # the workflow file `publish-npm.yml`, with no environment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `registry-url`: it would write an .npmrc auth line and export a placeholder auth token variable,
        # so a failed OIDC exchange would surface as a confusing registry 401/404 instead of ENEEDAUTH.
        with:
          node-version: 24
          cache: pnpm
      - name: npm CLI for trusted publishing
        # pnpm 10 does not exchange the OIDC token itself: `pnpm publish` packs the package (rewriting
        # `workspace:` ranges and applying publishConfig) and then runs `npm publish <tarball>` with the
        # npm next to node (pnpm v10.32.1 releasing/plugin-commands-publishing/src/publish.ts). npm does
        # the exchange, so the npm on PATH must be 11.5.1 or later. Pinned; check the version it reports.
        run: |
          set -euo pipefail
          npm install --global npm@11.21.1
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "${npm_version}" \
            || { echo "::error::npm ${npm_version} is older than 11.5.1; trusted publishing would fail"; exit 1; }
      - name: pnpm install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          : "${NPM_TOKEN:?NPM_TOKEN is required to read restricted build dependencies}"
          umask 077
          install_npmrc="$(mktemp "$RUNNER_TEMP/cueframe-npmrc.XXXXXX")"
          trap 'rm -f "$install_npmrc"' EXIT
          # npm expands the placeholder; never write the token value to this file.
          # shellcheck disable=SC2016
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$install_npmrc"
          NPM_CONFIG_USERCONFIG="$install_npmrc" pnpm install --frozen-lockfile
      - run: pnpm build
      - name: no package changed without a version bump (changeset publish skips published versions)
        run: pnpm check:published-versions
      - name: changeset publish
        # Publishes every package whose version npm does not have, each through `pnpm publish` (packing
        # with pnpm, so workspace: ranges and publishConfig are rewritten; npm then publishes the tarball
        # and does the OIDC exchange). Each package's publishConfig.access decides its visibility. A
        # version already on npm is skipped, so a re-run after a partial failure is safe. No git tags here:
        # this job cannot write to the repository; the tag job creates them.
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: pnpm changeset publish --no-git-tag

  tag:
    needs: [release-plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the App token below creates the tags
    steps:
      - name: the release App secrets are set
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_ID}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be set to tag the release"
            exit 1
          fi
      - name: App token (contents, this repository only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: tag the released commit once per published package
        # The same `<name>@<version>` names `changeset publish` creates. A tag already on this commit is
        # accepted, so a re-run is safe; a tag on another commit fails.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UNPUBLISHED: ${{ needs.release-plan.outputs.unpublished }}
        run: node scripts/tag-release.mjs "${UNPUBLISHED}"

  registry:
    # Publishes server.json to the MCP registry (registry.modelcontextprotocol.io). server.json lists
    # the hosted remote only, so nothing here depends on what npm serves; it runs after the npm job
    # only so one release publishes everything in a fixed order.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: publish server.json when its version is new
        # Authentication is `login http`: the registry fetches https://cueframe.ai/.well-known/mcp-registry-auth
        # (an ed25519 public key, `v=MCPv1; k=ed25519; p=...`) and the private key signs the challenge.
        # Flag names confirmed with `mcp-publisher login http --help` at v1.8.1: -domain, -private-key (hex),
        # -algorithm (default ed25519), -registry.
        env:
          MCP_PUBLISHER_PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          name="$(node -p "require('./server.json').name")"
          v="$(node -p "require('./server.json').version")"
          encoded="$(node -p "encodeURIComponent(require('./server.json').name)")"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit((JSON.parse(s).servers||[]).some(e=>(e.server||e).version==='${v}')?0:1))"; then
            echo "${name} ${v} is already in the registry; skipping"
            exit 0
          fi
          if [ -z "${MCP_PUBLISHER_PRIVATE_KEY}" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY is not set; cannot authenticate to the MCP registry"
            exit 1
          fi
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tgz" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login http --domain cueframe.ai --private-key "${MCP_PUBLISHER_PRIVATE_KEY}"
          "$RUNNER_TEMP/mcp-publisher" publish server.json
