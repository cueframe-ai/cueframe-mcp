version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /glama
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
