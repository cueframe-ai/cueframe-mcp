name: CI
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # scripts/check-contract-version.mjs runs in `pnpm check` AND in `pnpm test` (its self-history test
      # case); both must measure the same baseline. Every commit of a pull request is measured against the
      # PR's base, a push to main against the commit the push replaced; without this each would see one commit.
      CONTRACT_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # check:contract-version compares api/ against the event's base commit
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: production dependency audit
        # Fails on any advisory. esbuild is pinned to 0.28.2 through a global `pnpm.overrides` entry
        # in package.json: vite 8 takes esbuild as a peer, so a `vite>esbuild` override could not
        # reach the 0.27 instance that GHSA-g7r4-m6w7-qqqr flagged.
        run: pnpm audit --prod
      - run: pnpm check
      - name: generated API consumers are current
        run: pnpm check:api-consumer-drift
      - run: pnpm build
      - name: generated plugin manifests and skill cards are committed
        # pnpm build runs scripts/plugin/sync-versions.mjs and sync-openai-yaml.mjs; their output is committed.
        run: git diff --exit-code -- plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json gemini-extension.json skills/*/agents/openai.yaml skills/*/assets/icon.svg
      - name: Claude Code plugin validator
        # Checks the marketplace manifest, the plugin manifest and the skills directory. It does not read
        # hooks/hooks.json or .mcp.json; `pnpm check:plugin` and the hook step below cover those.
        # The claude-code version is pinned on purpose; bump it deliberately after re-running the three targets locally.
        run: |
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate skills --strict
      - name: session-start hook emits JSON
        run: bash hooks/session-start.sh | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s))"
      - name: the @cueframe/skills tarball carries the skills
        working-directory: packages/skills
        run: npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.txt" && grep -q "dist/skills/cueframe-connect/SKILL.md" "$RUNNER_TEMP/pack.txt"
      - name: build and verify hook-free OpenAI distribution
        run: pnpm build:plugin:openai && pnpm check:plugin:openai
      - run: pnpm test
      - name: pack and install the four packages into an empty consumer
        run: node scripts/pack-install-smoke.mjs
      - name: a package whose content changed is not still at a published version
        run: pnpm check:published-versions

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: server.json and glama.json validate against their live schemas
        # scripts/check-server-json.mjs (part of `pnpm check`) validates server.json offline against the
        # vendored copy of the 2025-12-11 registry schema; this step proves the vendored copy still equals
        # the schema the registry serves, then validates both documents against the live schemas.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/server.schema.json" https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          curl -sSfL -o "$RUNNER_TEMP/glama.schema.json" https://glama.ai/mcp/schemas/server.json
          cmp "$RUNNER_TEMP/server.schema.json" scripts/server.schema.2025-12-11.json
          npx -y ajv-cli@5.0.0 validate --strict=false -s "$RUNNER_TEMP/server.schema.json" -d server.json
          npx -y ajv-cli@5.0.0 validate --strict=false -s "$RUNNER_TEMP/glama.schema.json" -d glama.json
      - name: the discovery shim answers over stdio
        # glama/ is not a workspace member; it installs from its own lockfile, as the Dockerfile does.
        run: |
          cd glama
          npm ci --omit=dev --no-audit --no-fund
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node server.mjs \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=s.trim().split("\n").map(l=>JSON.parse(l));const init=r.find(m=>m.id===1),list=r.find(m=>m.id===2);if(init?.result?.serverInfo?.name!=="cueframe"||!init.result.instructions)throw new Error("initialize: "+JSON.stringify(init));const tools=list?.result?.tools;if(!(tools?.length>0))throw new Error("tools/list: "+JSON.stringify(list));const names=tools.map(t=>t.name);if(new Set(names).size!==names.length||names.some((n,i)=>i&&n<names[i-1]))throw new Error("tool names are not sorted and unique");for(const t of tools)if(!t.name||!t.description||!t.inputSchema)throw new Error("tool lacks name/description/inputSchema: "+JSON.stringify(t).slice(0,120));console.log(tools.length+" tools, "+init.result.instructions.length+" chars of instructions")})'
      - name: gitleaks
        # gitleaks/gitleaks-action exits 1 on organization-owned repos unless a GITLEAKS_LICENSE secret is
        # set. The gitleaks CLI itself is MIT and needs no license, so run the pinned release binary.
        # .gitleaks.toml allows the sha256 digests the contract sync records; nothing else.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --config .gitleaks.toml .
      - name: actionlint
        # rhysd/actionlint publishes release binaries, not a `uses:`-able action; run the pinned binary.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
