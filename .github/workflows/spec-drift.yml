name: spec drift

on:
  pull_request:
    paths:
      - api/openapi.json
      - .github/workflows/spec-drift.yml
  schedule:
    # Daily, so a copy that goes stale without a pull request is still caught.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The live spec goes through the same scene vendoring that produced the
      # repo copy, so the gate compares like with like. No install: the script
      # imports node builtins and two files in tools/.
      - name: fetch the spec production serves
        run: node tools/spec-drift.mjs --emit-base prod-openapi.json
      - name: full drift report
        uses: oasdiff/oasdiff-action/diff@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: prod-openapi.json
          revision: api/openapi.json
          format: text
          output-to-file: spec-drift.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-drift
          path: spec-drift.txt
      # Base is the live spec because that is the contract clients already hold,
      # so a breaking result means the repo copy promises something prod does not serve.
      - name: repo copy does not break the live contract
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: prod-openapi.json
          revision: api/openapi.json
          fail-on: ERR
          # Keep both specs inside CI; the default uploads them to oasdiff.com.
          review: 'false'
